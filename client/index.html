<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>SAA Process Endorsement</title>
    <style>
      .saa-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:linear-gradient(135deg,#001f4d 0%,#003a8c 55%,#0057c2 100%);font-family:Manrope,system-ui,sans-serif}
      .saa-boot img{border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
      .saa-boot-title{font-weight:900;font-size:1.25rem;letter-spacing:-.4px;
        background:linear-gradient(90deg,#2168FD,#37B1D3,#3AE4C9);-webkit-background-clip:text;background-clip:text;color:transparent}
      .saa-boot-bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
      .saa-boot-bar span{display:block;width:40%;height:100%;background:linear-gradient(90deg,#2168FD,#3AE4C9);
        animation:saaBoot 1.1s ease-in-out infinite}
      @keyframes saaBoot{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="saa-boot" role="status" aria-label="Loading SAA Process Endorsement">
        <img src="/favicon.svg" width="64" height="64" alt="" />
        <div class="saa-boot-title">SAA Process Endorsement</div>
        <div class="saa-boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
