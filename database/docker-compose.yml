services:
  postgres:
    image: postgres:18.6-alpine
    container_name: saa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saa}
      POSTGRES_DB: ${POSTGRES_DB:-saa}
      TZ: Asia/Manila
      PGTZ: Asia/Manila
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/<major>/docker,
      # so the persistent bind mount targets the parent directory.
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saa} -d ${POSTGRES_DB:-saa}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
